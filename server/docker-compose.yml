version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: shopethio_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shopethio
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build: .
    container_name: shopethio_backend
    restart: always
    ports:
      - "5001:5000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/shopethio?schema=public"
      PORT: 5000
    depends_on:
      - db
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules

volumes:
  postgres_data: